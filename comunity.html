<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Chat - Comunidades</title>
    <style>
        /* --- ESTILOS GERAIS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at top left, #282d2d 0%, #0a0b0b 100%);
        }

        /* Container do App */
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background-color: #0a0b0b;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* --- GLASSMORPHISM --- */
        .glass-effect {
            background: rgba(40, 45, 45, 0.4) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
        }

        /* --- HEADER --- */
        .header-comunidade {
            padding: 20px 15px 15px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-comunidade h2 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .svg-icon {
            width: 22px;
            height: 22px;
            fill: #ffffff;
            opacity: 0.8;
        }

        /* --- CONTEÚDO PRINCIPAL --- */
        .comunity-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        /* Opção de Criar Nova Comunidade */
        .create-comunity-btn {
            display: flex;
            align-items: center;
            padding: 15px;
            gap: 15px;
            cursor: pointer;
            border-bottom: 1px solid rgba(60, 60, 60, 0.2);
        }

        .icon-add-box {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .create-comunity-btn span {
            font-weight: 600;
            font-size: 15px;
        }

        /* --- ESTRUTURA DE COMUNIDADE (Estilo WhatsApp) --- */
        .comunity-section {
            margin-top: 15px;
            background: rgba(20, 22, 22, 0.4);
            border-top: 1px solid rgba(60, 60, 60, 0.2);
            border-bottom: 1px solid rgba(60, 60, 60, 0.2);
        }

        /* Linha Principal da Comunidade (Mãe) */
        .comunity-main-row {
            display: flex;
            align-items: center;
            padding: 15px;
            gap: 15px;
            border-bottom: 1px solid rgba(60, 60, 60, 0.2);
        }

        .comunity-badge {
            width: 48px;
            height: 48px;
            border-radius: 12px; /* Quadrado arredondado como no WhatsApp */
            background: linear-gradient(135deg, #3c3c3c, #282d2d);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .comunity-title h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .comunity-title p {
            font-size: 12px;
            color: #8a8a8a;
        }

        /* Sub-grupos vinculados à comunidade */
        .sub-group-item {
            display: flex;
            align-items: center;
            padding: 12px 15px 12px 78px; /* Recuo para alinhar embaixo do texto */
            gap: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .sub-group-item:hover {
            background-color: rgba(60, 60, 60, 0.2);
        }

        .sub-group-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(60, 60, 60, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sub-group-icon .svg-icon {
            width: 16px;
            height: 16px;
            opacity: 0.6;
        }

        .sub-group-info {
            flex: 1;
        }

        .sub-group-name {
            font-size: 14.5px;
            font-weight: 500;
        }

        .sub-group-msg {
            font-size: 12px;
            color: #b0b0b0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 240px;
        }

        /* --- FOOTBAR --- */
        .navigation-footbar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 65px;
            z-index: 10;
            border-top: 1px solid rgba(255, 255, 255, 0.08) !important;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 11px;
            cursor: pointer;
            gap: 5px;
            flex: 1;
            padding: 8px 0;
        }

        .nav-item .svg-icon {
            fill: rgba(255, 255, 255, 0.5);
        }

        .nav-item.active {
            color: #ffffff;
        }

        .nav-item.active .svg-icon {
            fill: #ffffff;
            opacity: 1;
        }

        @media screen and (max-width: 900px) {
            body {
                align-items: flex-start;
            }
            .app-container {
                max-width: 100%;
                height: 100vh;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="header-comunidade glass-effect">
            <h2>Comunidades</h2>
            <div class="header-icons">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s-.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s-.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </div>
        </header>

        <main class="comunity-content">
            
            <div class="create-comunity-btn">
                <div class="icon-add-box">
                    <svg class="svg-icon" style="width: 24px; height: 24px;" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </div>
                <span>Nova Comunidade</span>
            </div>

            <div class="comunity-section">
                <div class="comunity-main-row">
                    <div class="comunity-badge">🚀</div>
                    <div class="comunity-title">
                        <h3>Comunidade Fullstack</h3>
                        <p>3 grupos</p>
                    </div>
                </div>

                <div class="sub-group-item" onclick="abrirChatPrivado()">
                    <div class="sub-group-icon">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                    </div>
                    <div class="sub-group-info">
                        <div class="sub-group-name">📢 Avisos Gerais</div>
                        <div class="sub-group-msg">Genius: Nova aula de React Native liberada!</div>
                    </div>
                </div>

                <div class="sub-group-item" onclick="abrirChatPrivado()">
                    <div class="sub-group-icon">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 1.34 5 3s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                    </div>
                    <div class="sub-group-info">
                        <div class="sub-group-name">💬 Tirar Dúvidas</div>
                        <div class="sub-group-msg">João: Alguém conseguiu resolver o erro do cache?</div>
                    </div>
                </div>
            </div>

        </main>

        <footer class="navigation-footbar glass-effect">
            <div class="nav-item active">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 1.34 5 3s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                <span>Comunidade</span>
            </div>
            <div class="nav-item" onclick="irParaChats()">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                <span>Chats</span>
            </div>
            <div class="nav-item">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                <span>Ligações</span>
            </div>
            <div class="nav-item">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
                <span>Ajustes</span>
            </div>
        </footer>

    </div>

    <script>
        // Retorna para a tela de lista de chats principal
        function irParaChats() {
            window.location.href = "index.html";
        }

        // Abre a conversa privada ao clicar nos sub-grupos
        function abrirChatPrivado() {
            window.location.href = "chatPriv.html";
        }
    </script>
</body>
</html>
