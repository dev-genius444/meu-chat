<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidades</title>
    <link rel="stylesheet" href="comunity.css">
</head>

<body>

    <div class="app-container">

        <header class="header glass-effect">
            <h1 class="header-titulo">Comunidades</h1>
            <div class="header-icones">
                <button class="icon-botao">
                    <svg viewBox="0 0 24 24" class="svg-icon">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                    </svg>
                </button>
            </div>
        </header>

        <main class="scroll-conteudo">

            <div class="criar-comunidade-row">
                <div class="icon-criar-fundo">
                    <svg viewBox="0 0 24 24" class="svg-icon" style="fill: #000;">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                    </svg>
                </div>
                <div class="criar-texto-container">
                    <h2 class="criar-titulo">Criar nova comunidade</h2>
                </div>
            </div>

            <div class="divisor"></div>

            <div class="comunidade-card">

                <div class="comunidade-header">
                    <div class="avatar-comunidade">
                        <svg viewBox="0 0 24 24" class="svg-icon-brand">
                            <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 1.34 5 3s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" />
                        </svg>
                    </div>
                    <div class="comunidade-info">
                        <h3 class="comunidade-nome">Comunidade de Devs</h3>
                        <p class="comunidade-descricao">Espaço destinado para troca de networking e códigos.</p>
                    </div>
                </div>

                <div class="subgrupos-container">

                    <div class="subgrupo-item">
                        <div class="avatar-subgrupo">
                            <svg viewBox="0 0 24 24" class="svg-icon-gray">
                                <path d="M22 6.92L17.15 11H12V5h5.15L22 9.08v-2.16zM10 5H5c-1.1 0-2 .9-2 2v4c0 1.1.9 2 2 2h5V5zm3.5 13H12v-3.5h1.5V18z" />
                            </svg>
                        </div>
                        <div class="subgrupo-info-agrupada">
                            <div class="subgrupo-linha-topo">
                                <h4 class="subgrupo-nome">📢 Avisos Gerais</h4>
                                <span class="subgrupo-horario">12:45</span>
                            </div>
                            <p class="subgrupo-ultima-msg">Sejam bem-vindos ao servidor oficial!</p>
                        </div>
                    </div>

                    <div class="subgrupo-item">
                        <div class="avatar-subgrupo">
                            <svg viewBox="0 0 24 24" class="svg-icon-gray">
                                <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"></path>
                            </svg>
                        </div>
                        <div class="subgrupo-info-agrupada">
                            <div class="subgrupo-linha-topo">
                                <h4 class="subgrupo-nome">💬 Chat-Geral</h4>
                                <span class="subgrupo-horario">Ontem</span>
                            </div>
                            <p class="subgrupo-ultima-msg">Alguém saberia corrigir esse bug no CSS?</p>
                        </div>
                    </div>

                    <button class="btn-ver-tudo">
                        <span>Ver tudo</span>
                        <svg viewBox="0 0 24 24" class="svg-arrow">
                            <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z" />
                        </svg>
                    </button>

                </div>
            </div>

        </main>

        <nav class="app-tab-bar glass-effect">
            <div class="tab-item active" onclick="window.location.href='comunity.html'">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 1.34 5 3s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"></path>
                </svg>
                <span>Comunidade</span>
            </div>
            <div class="tab-item" onclick="window.location.href='index.html'">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"></path>
                </svg>
                <span>Chats</span>
            </div>
            <div class="tab-item">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"></path>
                </svg>
                <span>Ligações</span>
            </div>
            <div class="tab-item">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"></path>
                </svg>
                <span>Ajustes</span>
            </div>
        </nav>

    </div>

</body>

</html>
