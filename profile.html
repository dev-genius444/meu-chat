<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Chat - Perfil</title>
    <style>
        /* --- ESTILOS GERAIS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at top left, #282d2d 0%, #0a0b0b 100%);
        }

        /* Container do App */
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background-color: #0a0b0b;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* --- GLASSMORPHISM --- */
        .glass-effect {
            background: rgba(40, 45, 45, 0.4) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
        }

        /* --- HEADER --- */
        .profile-header {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 4px;
        }

        .profile-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .svg-icon {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        /* --- CONTEÚDO DO PERFIL --- */
        .profile-content {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* Área da Foto de Perfil Grande */
        .avatar-container {
            position: relative;
            width: 150px;
            height: 150px;
        }

        .big-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #3c3c3c, #282d2d);
            border: 2px solid rgba(0, 255, 204, 0.5); /* Detalhe em neon combinando com a sidebar */
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 64px;
            font-weight: bold;
            color: #ffffff;
        }

        /* Botão de Câmera/Editar Foto */
        .edit-photo-btn {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #282d2d;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }

        .edit-photo-btn:hover {
            transform: scale(1.05);
        }

        .edit-photo-btn .svg-icon {
            width: 18px;
            height: 18px;
            fill: #00ffcc; /* Ícone com tom neon */
        }

        /* --- CAMPOS DE INFORMAÇÃO (Estilo WhatsApp) --- */
        .info-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            padding: 12px 15px;
            background: rgba(40, 45, 45, 0.2);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-icon-box {
            padding-top: 2px;
        }

        .info-icon-box .svg-icon {
            opacity: 0.5;
            width: 20px;
            height: 20px;
        }

        .info-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            font-size: 12px;
            color: #8a8a8a;
            font-weight: 500;
        }

        .info-value {
            font-size: 15px;
            color: #ffffff;
            font-weight: 500;
        }

        .info-subtext {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            line-height: 1.3;
            margin-top: 2px;
        }

        .edit-value-btn {
            background: none;
            border: none;
            cursor: pointer;
            align-self: center;
        }

        .edit-value-btn .svg-icon {
            width: 18px;
            height: 18px;
            fill: #00ffcc;
            opacity: 0.8;
        }

        @media screen and (max-width: 900px) {
            body {
                align-items: flex-start;
            }
            .app-container {
                max-width: 100%;
                height: 100vh;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="profile-header glass-effect">
            <button class="back-btn" onclick="voltarParaHome()">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <h2>Perfil</h2>
        </header>

        <main class="profile-content">
            
            <div class="avatar-container">
                <div class="big-avatar" id="profileLetter">G</div>
                <div class="edit-photo-btn" onclick="alterarFoto()">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 12c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm0-7c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm0 11c-2.67 0-8 1.34-8 4v2h16v-2c0-2.67-5.33-4-8-4z"/></svg>
                </div>
            </div>

            <div class="info-container">
                
                <div class="info-row">
                    <div class="info-icon-box">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.67-5.33-4-8-4z"/></svg>
                    </div>
                    <div class="info-body">
                        <span class="info-label">Nome</span>
                        <span class="info-value" id="profileName">Genius</span>
                        <p class="info-subtext">Este não é seu nome de usuário nem um PIN. Esse nome será visível para seus contatos do MeuChat.</p>
                    </div>
                    <button class="edit-value-btn" onclick="editarCampo('Nome', 'profileName')">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    </button>
                </div>

                <div class="info-row">
                    <div class="info-icon-box">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>
                    </div>
                    <div class="info-body">
                        <span class="info-label">Recado</span>
                        <span class="info-value" id="profileStatus">Focando nos códigos... 🚀</span>
                    </div>
                    <button class="edit-value-btn" onclick="editarCampo('Recado', 'profileStatus')">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    </button>
                </div>

                <div class="info-row">
                    <div class="info-icon-box">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                    </div>
                    <div class="info-body">
                        <span class="info-label">Telefone</span>
                        <span class="info-value">+55 (11) 99999-9999</span>
                    </div>
                    </div>

            </div>

        </main>

    </div>

    <script>
        // Função do botão voltar
        function voltarParaHome() {
            window.location.href = "index.html";
        }

        // Simulação dinâmica para editar campos de texto (Nome e Recado)
        function editarCampo(nomeCampo, idElemento) {
            const elemento = document.getElementById(idElemento);
            const valorAtual = elemento.innerText;
            
            const novoValor = prompt(`Editar ${nomeCampo}:`, valorAtual);
            
            if (novoValor !== null && novoValor.trim() !== "") {
                elemento.innerText = novoValor.trim();
                
                // Se alterou o nome, muda também a primeira letra do avatar
                if (idElemento === 'profileName') {
                    document.getElementById('profileLetter').innerText = novoValor.trim().charAt(0).toUpperCase();
                }
            }
        }

        // Função placeholder para simular troca de foto
        function alterarFoto() {
            alert("Funcionalidade de carregar imagem de perfil será integrada com seu banco de dados!");
        }
    </script>
</body>
</html>
