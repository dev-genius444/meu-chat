<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./profile.css">
    <title>Meu Chat - Perfil</title>
</head>
<body>

    <div class="app-container">
        
        <header class="profile-header glass-effect">
            <button class="back-btn" onclick="voltarParaHome()">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <h2>Perfil</h2>
        </header>

        <main class="profile-content">
            
            <div class="avatar-container">
                <div class="big-avatar" id="profileLetter">G</div>
                <div class="edit-photo-btn" onclick="alterarFoto()">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 12c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm0-7c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm0 11c-2.67 0-8 1.34-8 4v2h16v-2c0-2.67-5.33-4-8-4z"/></svg>
                </div>
            </div>

            <div class="info-container">
                
                <div class="info-row">
                    <div class="info-icon-box">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.67-5.33-4-8-4z"/></svg>
                    </div>
                    <div class="info-body">
                        <span class="info-label">Nome</span>
                        <span class="info-value" id="profileName">Genius</span>
                        <p class="info-subtext">Este não é seu nome de usuário nem um PIN. Esse nome será visível para seus contatos do MeuChat.</p>
                    </div>
                    <button class="edit-value-btn" onclick="editarCampo('Nome', 'profileName')">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    </button>
                </div>

                <div class="info-row">
                    <div class="info-icon-box">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>
                    </div>
                    <div class="info-body">
                        <span class="info-label">Recado</span>
                        <span class="info-value" id="profileStatus">Focando nos códigos... 🚀</span>
                    </div>
                    <button class="edit-value-btn" onclick="editarCampo('Recado', 'profileStatus')">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    </button>
                </div>

                <div class="info-row">
                    <div class="info-icon-box">
                        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                    </div>
                    <div class="info-body">
                        <span class="info-label">Telefone</span>
                        <span class="info-value">+55 (11) 99999-9999</span>
                    </div>
                </div>

                <div class="logout-container">
                    <button class="btn-sair" onclick="deslogar()">Sair da Conta</button>
                </div>

            </div>

        </main>

    </div>
<script src="theme.js"></script>
    <script src="profile.js"></script>
</body>
</html>
