<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Chat - Cadastro</title>
    <style>
        /* --- ESTILOS GERAIS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at bottom left, #282d2d 0%, #0a0b0b 100%);
            overflow: hidden;
        }

        /* Container do App */
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background-color: #0a0b0b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 30px;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* --- LOGO / TOPO --- */
        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #00ffcc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .register-header p {
            font-size: 14px;
            color: #8a8a8a;
            margin-top: 5px;
        }

        /* --- BOTÕES SOCIAIS --- */
        .social-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-social {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(40, 45, 45, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-social:hover {
            border-color: #00ffcc;
            background: rgba(0, 255, 204, 0.05);
        }

        .social-icon {
            width: 18px;
            height: 18px;
        }

        /* --- DIVISOR --- */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin-bottom: 25px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        /* --- FORMULÁRIO --- */
        .form-scroll {
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Estilização da barra de rolagem */
        .form-scroll::-webkit-scrollbar { width: 4px; }
        .form-scroll::-webkit-scrollbar-thumb { background: #3c3c3c; border-radius: 10px; }

        .form-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 11px;
            color: #8a8a8a;
            font-weight: 700;
            text-transform: uppercase;
            padding-left: 5px;
        }

        .input-field {
            width: 100%;
            background: rgba(40, 45, 45, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .input-field:focus {
            border-color: #00ffcc;
            background: rgba(40, 45, 45, 0.5);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
        }

        /* --- BOTÃO CRIAR CONTA --- */
        .btn-register {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: #00ffcc;
            color: #0a0b0b;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.2);
            transition: all 0.2s ease;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 204, 0.4);
        }

        /* LINK PARA LOGIN */
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #8a8a8a;
        }

        .login-link a {
            color: #00ffcc;
            text-decoration: none;
            font-weight: 700;
        }

        @media screen and (max-width: 900px) {
            .app-container { max-width: 100%; height: 100vh; box-shadow: none; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="register-header">
            <h1>MeuChat</h1>
            <p>Crie sua conta em poucos segundos</p>
        </header>

        <div class="social-container">
            <button class="btn-social" onclick="socialAuth('Google')">
                <svg class="social-icon" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12.24 10.285V14.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l3.227-3.111C18.29 1.95 15.54 1 12.24 1 6.16 1 1.2 5.93 1.2 12s4.96 11 11.04 11c6.35 0 10.57-4.44 10.57-10.75 0-.72-.08-1.27-.17-1.72h-10.4z"/>
                </svg>
                <span>Google</span>
            </button>

            <button class="btn-social" onclick="socialAuth('Apple')">
                <svg class="social-icon" viewBox="0 0 24 24" fill="#ffffff">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.22.67-2.94 1.52-.64.74-1.2 1.88-1.05 2.99 1.11.09 2.24-.55 3-1.45z"/>
                </svg>
                <span>Apple</span>
            </button>
        </div>

        <div class="divider">ou preencha os dados</div>

        <div class="form-scroll">
            <form class="form-container" onsubmit="validarCadastro(event)">
                
                <div class="input-group">
                    <label>Nome Completo</label>
                    <input type="text" class="input-field" placeholder="Como quer ser chamado?" required>
                </div>

                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" class="input-field" placeholder="exemplo@email.com" required>
                </div>

                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="senha" class="input-field" placeholder="Crie uma senha forte" required>
                </div>

                <div class="input-group">
                    <label>Confirmar Senha</label>
                    <input type="password" id="confirmarSenha" class="input-field" placeholder="Repita a senha" required>
                </div>

                <button type="submit" class="btn-register">Criar minha conta</button>
            </form>
        </div>

        <div class="login-link">
            Já tem uma conta? <a href="login.html">Faça login</a>
        </div>

    </div>

    <script>
        function validarCadastro(event) {
            event.preventDefault();
            
            const senha = document.getElementById('senha').value;
            const confirmar = document.getElementById('confirmarSenha').value;

            if (senha !== confirmar) {
                alert("As senhas não coincidem! Tente novamente.");
                return;
            }

            // Simulação de sucesso
            alert("Conta criada com sucesso! Bem-vindo ao MeuChat.");
            window.location.href = "index.html";
        }

        function socialAuth(rede) {
            alert(`Iniciando cadastro via ${rede}...`);
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
