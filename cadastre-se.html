<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./cadastre-se.css">
    <title>Meu Chat - Cadastro</title>

    
</head>
<body>

    <div class="app-container">
        
        <header class="register-header">
            <div class="titulo">
                <img src="./nyvo.png" alt="" width="50">
                <h1>NYVO</h1>
            </div>

            <p>Crie sua conta em poucos segundos</p>
        </header>

        <div class="social-container">
            <button class="btn-social" onclick="socialAuth('Google')">
                <svg class="social-icon" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12.24 10.285V14.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l3.227-3.111C18.29 1.95 15.54 1 12.24 1 6.16 1 1.2 5.93 1.2 12s4.96 11 11.04 11c6.35 0 10.57-4.44 10.57-10.75 0-.72-.08-1.27-.17-1.72h-10.4z"/>
                </svg>
                <span>Google</span>
            </button>

            <button class="btn-social" onclick="socialAuth('Apple')">
                <svg class="social-icon" viewBox="0 0 24 24" fill="#ffffff">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.22.67-2.94 1.52-.64.74-1.2 1.88-1.05 2.99 1.11.09 2.24-.55 3-1.45z"/>
                </svg>
                <span>Apple</span>
            </button>
        </div>

        <div class="divider">ou preencha os dados</div>

        <div class="form-scroll">
            <form class="form-container" onsubmit="validarCadastro(event)">
                
                <div class="input-group">
                    <label>Nome Completo</label>
                    <input type="text" class="input-field" placeholder="Como quer ser chamado?" required>
                </div>

                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" class="input-field" placeholder="exemplo@email.com" required>
                </div>

                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="senha" class="input-field" placeholder="Crie uma senha forte" required>
                </div>

                <div class="input-group">
                    <label>Confirmar Senha</label>
                    <input type="password" id="confirmarSenha" class="input-field" placeholder="Repita a senha" required>
                </div>

                <button type="submit" class="btn-register">Criar minha conta</button>
            </form>
        </div>

        <div class="login-link">
            Já tem uma conta? <a href="login.html">Faça login</a>
        </div>

    </div>

    <script src="cadastre-se.js"></script>
</body>
</html>
