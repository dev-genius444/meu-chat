<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Chat - Conversa Privada</title>
    <style>
        /* --- ESTILOS GERAIS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at bottom left, #282d2d 0%, #0a0b0b 100%);
        }

        /* Container do App */
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background-color: #0a0b0b;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* --- EFETIO LIQUID GLASS (Componentes Fixos) --- */
        .liquid-glass {
            background: rgba(40, 45, 45, 0.35) !important;
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* --- HEADER --- */
        .chat-header {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 4px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 15px;
        }

        .user-info h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .user-info p {
            font-size: 12px;
            color: #b0b0b0;
        }

        .svg-icon {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        /* --- ÁREA DE MENSAGENS --- */
        .chat-messages {
            flex: 1;
            padding: 20px 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* --- BALÕES ESTILO LIQUID GLASS --- */
        .message {
            max-width: 78%;
            padding: 12px 16px;
            font-size: 14.5px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Balão Recebido (Estilo Vidro Fluido Escuro) */
        .message.received {
            background: linear-gradient(135deg, rgba(40, 45, 45, 0.6) 0%, rgba(60, 60, 60, 0.3) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            align-self: flex-start;
            border-radius: 20px 20px 20px 4px; /* Pontas arredondadas estilo líquida */
        }

        /* Balão Enviado (Estilo Vidro Fluido Claro/Destaque) */
        .message.sent {
            background: linear-gradient(135deg, rgba(60, 60, 60, 0.7) 0%, rgba(40, 45, 45, 0.4) 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            align-self: flex-end;
            border-radius: 20px 20px 4px 20px;
        }

        .message-time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            text-align: right;
            margin-top: 5px;
            display: block;
        }

        /* --- ÁREA DO INPUT --- */
        .chat-input-area {
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
            border-top: none;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .input-wrapper {
            flex: 1;
            background: rgba(60, 60, 60, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 2px 6px 2px 14px;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            flex: 1;
            background: none;
            border: none;
            padding: 10px 0;
            color: white;
            outline: none;
            font-size: 14.5px;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .send-btn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.05) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
        }

        .send-btn:active {
            transform: scale(0.92);
        }

        .send-btn .svg-icon {
            width: 16px;
            height: 16px;
            margin-left: 2px;
        }

        /* --- RESPONSIVIDADE --- */
        @media screen and (max-width: 900px) {
            body {
                align-items: flex-start;
            }
            .app-container {
                max-width: 100%;
                height: 100vh;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="chat-header liquid-glass">
            <button class="back-btn" onclick="voltarParaLista()">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <div class="avatar">DC</div>
            <div class="user-info">
                <h3>Dev Club Grupo</h3>
                <p>online</p>
            </div>
        </header>

        <main class="chat-messages" id="chatContainer">
            <div class="message received">
                Fala dev! Tudo certo com o projeto do Expo?
                <span class="message-time">10:15</span>
            </div>
            <div class="message sent">
                Eaí! Tudo certo, consegui resolver o problema do Supabase e das fontes!
                <span class="message-time">10:16</span>
            </div>
            <div class="message received">
                Show de bola! Esse tema dark ficou top demais.
                <span class="message-time">10:17</span>
            </div>
        </main>

        <div class="chat-input-area liquid-glass">
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="Digite uma mensagem..." autocomplete="off">
                <button class="send-btn" id="sendBtn">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>

    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        // Função de voltar para o arquivo principal
        function voltarParaLista() {
            window.location.href = "index.html"; // Altere aqui se o seu arquivo principal tiver outro nome
        }

        // Enviar mensagem
        function sendMessage() {
            const text = messageInput.value.trim();
            if (text === "") return;

            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', 'sent');

            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            messageDiv.innerHTML = `${text} <span class="message-time">${timeStr}</span>`;

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            messageInput.value = "";
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Forçar scroll para o final ao carregar
        chatContainer.scrollTop = chatContainer.scrollHeight;
    </script>
</body>
</html>
