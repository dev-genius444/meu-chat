<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./chatPriv.css">
    <title>Meu Chat - Conversa Privada</title>

</head>

<body>

    <div class="app-container">

        <header class="chat-header liquid-glass">
            <button class="back-btn" onclick="voltarParaLista()">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                </svg>
            </button>
            <div class="avatar">DC</div>
            <div class="user-info">
                <h3>Dev Club Grupo</h3>
                <p>online</p>
            </div>
        </header>

        <main class="chat-messages" id="chatContainer">
            <div class="message received">
                Fala dev! Tudo certo com o projeto do Expo?
                <span class="message-time">10:15</span>
            </div>
            <div class="message sent">
                Eaí! Tudo certo, consegui resolver o problema do Supabase e das fontes!
                <span class="message-time">10:16</span>
            </div>
            <div class="message received">
                Show de bola! Esse tema dark ficou top demais.
                <span class="message-time">10:17</span>
            </div>
        </main>

        <div class="chat-input-area liquid-glass">
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="Digite uma mensagem..." autocomplete="off">
                <button class="send-btn" id="sendBtn">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                </button>
            </div>
        </div>

    </div>
    <script src="theme.js"></script>
    <script src="chatPriv.js"></script>

</body>

</html>
